name: Check & Update Cosmo Dependency

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 06:00 UTC
  workflow_dispatch:      # Allows manual trigger

jobs:
  update-dependency:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Find Latest Cosmo Router Release Tag
        id: cosmo_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Query GitHub API for the latest tag matching 'router@'
          LATEST_TAG=$(gh release list -R wundergraph/cosmo --jq '.[].name' --json name | grep -E '^router@' | head -n 1)
          echo "Found tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          COMMIT_SHA=$(gh api graphql -F owner='wundergraph' -F name='cosmo' -F tag="$LATEST_TAG" \ 
          -f query='query($name: String!, $owner: String!, $tag: String!) \
          { repository(owner: $owner, name: $name)  \
          { ref(qualifiedName: $tag) \ 
          { name target { oid __typename ... on Commit { oid } ... on Tag {target { ... on Commit { oid } } } } } } } ' \
          -q '.data.repository.ref.target | (.target.oid // .oid)')
          echo "Commit SHA for $LATEST_TAG = $COMMIT_SHA"

      - name: Update go.mod
        run: |
          go get github.com/wundergraph/cosmo/router@$COMMIT_SHA
          go mod tidy

      - name: Create Pull Request if Changed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "build(deps): bump github.com/wundergraph/cosmo/router to ${{ steps.cosmo_tag.outputs.tag }}"
          title: "Bumps github.com/wundergraph/cosmo/router to ${{ steps.cosmo_tag.outputs.tag }}"
          body: |
            Bumps `github.com/wundergraph/cosmo/router` to upstream tag `${{ steps.cosmo_tag.outputs.tag }}`.
          branch: "update-cosmo-router"
          delete-branch: true