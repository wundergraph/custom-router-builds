name: Check & Update Cosmo Dependency

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes
  workflow_dispatch:        # Allows manual trigger

jobs:
  update-dependency:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Latest Cosmo Router Release Tag
        id: cosmo_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Query GitHub API for the latest tag matching 'router@'
          LATEST_TAG=$(gh release list -R wundergraph/cosmo --jq '.[].name' --json name | grep -E '^router@' | head -n 1)
          echo "Found tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          # Get commit hash for the tagged version
          COMMIT_SHA=$(gh api graphql -F owner='wundergraph' -F name='cosmo' -F tag="$LATEST_TAG" -f query='query($name: String!, $owner: String!, $tag: String!) { repository(owner: $owner, name: $name) { ref(qualifiedName: $tag) { name target { oid __typename ... on Commit { oid } ... on Tag {target { ... on Commit { oid } } } } } } } ' -q '.data.repository.ref.target | (.target.oid // .oid)' )
          echo "Commit SHA for $LATEST_TAG = $COMMIT_SHA"
          echo "commit=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

          # Extract raw semver (e.g., 0.357.0 from router@0.357.0)
          VERSION=${LATEST_TAG#router@}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if Tag Already Released
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.cosmo_tag.outputs.tag }}"
          git fetch --tags origin
          if git rev-parse "$TAG" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists in this repository. Skipping remaining steps."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist. Proceeding with update."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Update go.mod
        if: steps.check_release.outputs.skip != 'true'
        run: |
          COMMIT_SHA="${{ steps.cosmo_tag.outputs.commit }}"
          go get github.com/wundergraph/cosmo/router@$COMMIT_SHA
          go mod tidy

      - name: Create Pull Request if Changed
        if: steps.check_release.outputs.skip != 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "build(deps): bump github.com/wundergraph/cosmo/router to ${{ steps.cosmo_tag.outputs.version }}"
          title: "Bumps github.com/wundergraph/cosmo/router to ${{ steps.cosmo_tag.outputs.version }}"
          body: |
            Bumps `github.com/wundergraph/cosmo/router` to upstream tag `${{ steps.cosmo_tag.outputs.tag }}`.
          branch: "update-cosmo-router"
          delete-branch: true

      - name: Auto-Merge Pull Request
        if: steps.check_release.outputs.skip != 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Merging pull request: $PR_URL"
          # Attempt auto-merge if repo settings allow it; otherwise merge immediately via squash
          gh pr merge "$PR_URL" --auto --squash --delete-branch || gh pr merge "$PR_URL" --squash --delete-branch

          # Wait up to 30s to ensure the PR is merged into main
          for i in {1..15}; do
            STATE=$(gh pr view "$PR_URL" --json state --jq .state)
            if [ "$STATE" = "MERGED" ]; then
              echo "PR successfully merged."
              break
            fi
            echo "Waiting for PR to merge... (attempt $i)"
            sleep 2
          done

      - name: Create GitHub Release
        if: steps.check_release.outputs.skip != 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          TAG: ${{ steps.cosmo_tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating release for $TAG"
          gh release create "$TAG" \
            --target main \
            --title "Release $TAG" \
            --generate-notes
